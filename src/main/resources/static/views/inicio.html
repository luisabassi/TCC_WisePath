<template id="tela">
  <div class="mesh-bg">

    <nav class="welcome-nav">
      <div class="logo-row logo-row-sm">
        <img src="/assets/logo.png" alt="WisePath" />
        <span class="logo-text">WisePath</span>
      </div>
      <div class="welcome-nav-right">
        <button class="logout-btn" id="inicio-sair" title="Sair">
          <i data-icone="sair"></i>
          <span>Sair</span>
        </button>
        <div data-encaixe="avatar"></div>
      </div>
    </nav>

    <div class="welcome-hero">
      <h1 class="h1 welcome-title">Bem vindo(a) ao WisePath!</h1>
      <p class="muted welcome-subtitle">
        Descubra mais sobre si mesmo, explore seus interesses e habilidades e encontre possibilidades de carreira alinhadas aos seus valores e propósitos.
      </p>
      <div class="welcome-btns">
        <button class="btn-primary" id="inicio-iniciar">Iniciar conversa</button>
        <button class="btn-outline" id="inicio-mapas">Ver mapas mentais</button>
      </div>
    </div>

    <div class="welcome-section">
      <h2 class="h2 welcome-section-title">Como o ikigai funciona</h2>
      <p class="muted welcome-section-desc">
        O Ikigai é um conceito japonês relacionado ao propósito de vida. No WisePath, sua representação ocidental é
        utilizada para explorar quatro elementos que, quando relacionados,
        ajudam a refletir sobre a realização pessoal e profissional.
      </p>
      <div class="welcome-cards">
        <div class="welcome-card">
          <span class="welcome-card-emoji">🩷</span>
          <div>
            <div class="welcome-card-title">Aquilo que você ama</div>
            <div class="welcome-card-desc">Suas paixões, hobbies, o que te energiza.</div>
          </div>
        </div>
        <div class="welcome-card">
          <span class="welcome-card-emoji">🧭</span>
          <div>
            <div class="welcome-card-title">Aquilo que você é bom</div>
            <div class="welcome-card-desc">Seus talentos naturais e habilidades aprendidas.</div>
          </div>
        </div>
        <div class="welcome-card">
          <span class="welcome-card-emoji">🌐</span>
          <div>
            <div class="welcome-card-title">O que o mundo precisa</div>
            <div class="welcome-card-desc">Problemas e causas que pedem soluções.</div>
          </div>
        </div>
        <div class="welcome-card">
          <span class="welcome-card-emoji">💼</span>
          <div>
            <div class="welcome-card-title">Pelo que você pode ser remunerado</div>
            <div class="welcome-card-desc">Onde há mercado e remuneração viável.</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</template>
